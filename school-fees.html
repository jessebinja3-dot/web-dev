        <style>

        <h1>Neverland High School Fee Calculator</h1>

        <!-- Program Selection -->>
         <label for="field">Field:</label>
                    <select id="field" name="field">
                        <option value="">Select your field</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English-Art">English-Art</option>
                        <option value="social-studies">Social Studies</option>
                        <option value="world-languages">World languages</option>
                        <option value="information-technology">Information technology</option>
                        <option value="football">Football</option>
                    </select>

        <!--Year/Level-->>
        <label for="year">Year</label>
                    <select id="year" name="year">
                        <option value="">Select your year</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
        </label>

        <!-- ChildNumber -->>
         <label for="ChildNumber">ChildNumber:</label>
        <input type="number" id="childNumber" name="childNumber" min="1" placeholder="Enter your child number (1, 2, 3, etc.)">
    </label>

        <button onclick="calculateFee()">Calculate Fee</button>
        
        <div class="result" id="result"></div>

        <script>
            const feeSchedule = {
                "Science": {
                    1: 3000000,
                    2: 3500000,
                    3: 4000000,
                    4: 4500000
                },
                "Mathematics": {
                    1: 2500000,
                    2: 2500000,
                    3: 2500000,
                    4: 2500000
                },
                "English-Art": {
                    1: 2000000,
                    2: 2000000,
                    3: 2000000,
                    4: 2000000
                },
                "social-studies": {
                    1: 1500000,
                    2: 1500000,
                    3: 1700000,
                    4: 1700000,
                },
                "world-languages": {
                    1: 1000000,
                    2: 1000000,
                    3: 1000000,
                    4: 1000000
                },
                "information-technology": {
                    1: 1200000,
                    2: 1200000,
                    3: 1200000,
                    4: 1200000
                }
            };

            function calculateDiscountFee(baseFee, childNumber) {
                let discount = 0;
                if (childNumber === 2) {
                    discount = 0.05; // 5% discount for second child
                }
                else if (childNumber ===3 ) {
                    discount = 0.10; // 10% discount for third child
                }
                else if (childNumber >= 4) {
                    discount = 0.15; // 15% discount for fourth child and beyond
                }
                return baseFee * (1 - discount);
            }

            function calculateFee() {
                const program = (document.getElementById("program").value);
                const yearLevel = parseInt(document.getElementById("yearLevel").value);
                const childNumberInput = document.getElementById("childNumber");
                const childNumber = parseInt(document.getElementById("childNumber").value);

                let baseFee;

                if (program === "Science" || program === "Mathematics" || program === "English-Art" || program === "social-studies" || program === "world-languages" || program === "information-technology") {
                    baseFee = feeSchedule[program][yearLevel];
                } else {
                    baseFee = feeSchedule[program];
                }

                if (baseFee === undefined) {
                    document.getElementById("result").innerText = "Invalid year/level for the selected program.";
                    return;
                }
                if (!childNumber || childNumber < 1) {
                    document.getElementById("result").innerText = "Please enter a valid child number (1 or greater).";
                    return;
                }

                const finalFee = calculateDiscountFee(baseFee, childNumber);
                document.getElementById("result").innerText = `Base Fee: ${baseFee.toLocaleString()} UGX\n | Final Fee (Child ${childNumber}): ${finalFee.toLocaleString()} UGX\n`;
            }
            </script>
